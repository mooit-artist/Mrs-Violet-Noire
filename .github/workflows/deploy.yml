name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stage site files
        # Only the files the site needs are published. scripts/,
        # workflows, docs and the raw Goodreads export stay out of the artifact.
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          for f in index.html 404.html .nojekyll robots.txt sitemap.xml CNAME; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          if [ -d assets ]; then cp -R assets _site/assets; fi
          # Only the built library is public; the raw Goodreads export and notes stay in the repo.
          mkdir -p _site/data
          cp data/books.json _site/data/books.json
          echo "Staged files:"
          find _site -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
